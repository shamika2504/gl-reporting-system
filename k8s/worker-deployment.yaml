apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: gl-reporting
  labels:
    app: gl-reporting-worker
spec:
  replicas: 1
  # A single Celery worker doesn't need zero-downtime rolling updates the way
  # the backend API does — Recreate avoids ever needing 2x replicas' worth of
  # CPU/memory at once, which the single-node dev cluster doesn't have room
  # for (RollingUpdate's surge pod would sit Pending with Insufficient cpu).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gl-reporting-worker
  template:
    metadata:
      labels:
        app: gl-reporting-worker
    spec:
      serviceAccountName: gl-reporting-app-sa
      containers:
        - name: worker
          # Same image as backend — placeholder rewritten by the deploy
          # workflow to <ECR_REGISTRY>/gl-reporting-backend:<git-sha>.
          image: gl-reporting-backend:latest
          command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4"]
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - secretRef:
                name: gl-reporting-secrets
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: QDRANT_URL
              value: http://qdrant.gl-reporting.svc.cluster.local:6333
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
