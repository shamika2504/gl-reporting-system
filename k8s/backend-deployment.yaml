apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gl-reporting
  labels:
    app: gl-reporting-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gl-reporting-backend
  template:
    metadata:
      labels:
        app: gl-reporting-backend
    spec:
      serviceAccountName: gl-reporting-app-sa
      containers:
        - name: backend
          # Placeholder — the deploy workflow rewrites this to
          # <ECR_REGISTRY>/gl-reporting-backend:<git-sha> before `kubectl apply`.
          image: gl-reporting-backend:latest
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: gl-reporting-secrets
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: QDRANT_URL
              value: http://qdrant.gl-reporting.svc.cluster.local:6333
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
