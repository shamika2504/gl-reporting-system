# Requires the External Secrets Operator (see infra/eks-setup.sh
# external-secrets) and the "external-secrets-sa" IRSA ServiceAccount in this
# namespace. Nothing here is a hardcoded credential — this only describes how
# to pull the real values from AWS Secrets Manager at "gl-reporting/prod".
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: gl-reporting
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gl-reporting-app-secrets
  namespace: gl-reporting
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: gl-reporting-secrets
    creationPolicy: Owner
  data:
    # remoteRef property names match the JSON keys written by
    # infra/aws-setup.sh's `secrets` section. secretKey names match the env
    # vars backend/core/config.py actually reads.
    - secretKey: DATABASE_URL
      remoteRef:
        key: gl-reporting/prod
        property: DB_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: gl-reporting/prod
        property: REDIS_URL
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: gl-reporting/prod
        property: ANTHROPIC_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: gl-reporting/prod
        property: OPENAI_API_KEY
    - secretKey: AWS_S3_BUCKET
      remoteRef:
        key: gl-reporting/prod
        property: S3_BUCKET_NAME
    - secretKey: LANGCHAIN_API_KEY
      remoteRef:
        key: gl-reporting/prod
        property: LANGCHAIN_API_KEY
    - secretKey: LANGCHAIN_TRACING_V2
      remoteRef:
        key: gl-reporting/prod
        property: LANGCHAIN_TRACING_V2
    - secretKey: LANGCHAIN_PROJECT
      remoteRef:
        key: gl-reporting/prod
        property: LANGCHAIN_PROJECT
